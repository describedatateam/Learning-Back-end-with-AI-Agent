<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 240 240" role="img" aria-labelledby="t-5a-favicon-dark d-5a-favicon-dark"><title id="t-5a-favicon-dark">.describe( app icon on navy</title><desc id="d-5a-favicon-dark">The .describe( astrolabe mark: an open graduated ring interrupted at the upper right by a target star, with a tangent bowl, a horizontal sighting rule and a vertical stem. An instrument for knowing where you are so you can decide where to go.</desc><rect x="-20" y="-20" width="240" height="240" rx="48" fill="#092052"/><g id="RING"><path d="M176.9 61.49A86 86 0 1 1 149.82 29.9" fill="none" stroke="#F6F8FC" stroke-width="8" stroke-linecap="round"/></g><g id="BOWL"><circle cx="66.59" cy="128.63" r="42" fill="none" stroke="#F6F8FC" stroke-width="8"/></g><g id="RULE"><path d="M24.59 128.63H108.59" fill="none" stroke="#F6F8FC" stroke-width="8" stroke-linecap="round"/></g><g id="STEM"><path d="M108.59 21.86V170.63" fill="none" stroke="#5B93FF" stroke-width="13" stroke-linecap="round"/></g><g id="STAR"><circle cx="165.3" cy="44.03" r="8" fill="#F6F8FC"/></g></svg>
